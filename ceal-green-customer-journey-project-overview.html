<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEAL Green — Customer Journey Project Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       CEAL GREEN DESIGN SYSTEM TOKENS
       Source: ceal-green-brand-guidelines.md — Section 5 Visual Identity
       (Approved 2026-06-09 by Ryan Roper)
    ═══════════════════════════════════════════════════════════════════════ */
    :root {
      /* ── Core brand palette ─────────────────────────────────── */
      --cg-mangrove:       #1E4D3A;  /* Primary brand — used for phase headers, key accents */
      --cg-oatmeal:        #F7F4EE;  /* Primary light surface — page background */
      --cg-near-black:     #1A1F1E;  /* Body text */
      --cg-aged-teak:      #B87A4E;  /* Accent — used for highlights, agentic platform */
      --cg-mid-canopy:     #8DCFAA;  /* Secondary green — phase 2 */
      --cg-pale-sand:      #E8D8C4;  /* Warm secondary — dividers, phase 3 */

      /* ── Derived surfaces ───────────────────────────────────── */
      --cg-mangrove-dark:  #163829;  /* Deeper tone for section headers */
      --cg-mangrove-light: #2A5E47;  /* Lighter mangrove for hover states */
      --cg-surface:        #FFFFFF;  /* Card surfaces */
      --cg-surface-warm:   #FBF9F5;  /* Warm card variant */

      /* ── Status color variables (as defined in the brief) ──── */
      --status-approved:   #2D7A4F;  /* Approved / Complete — green */
      --status-progress:   #C47D2A;  /* In Progress / Awaiting — amber */
      --status-blocked:    #9B2D30;  /* Blocked — garnet/red */
      --status-not-started:#8A8A8A;  /* Not Started — grey */
      --status-gap:        #5E3A2B;  /* Open Gap / Needs Hiring — deep earth warm */

      /* Lighter tints of status colors for backgrounds */
      --status-approved-bg:   #EBF5EF;
      --status-progress-bg:   #FEF5E7;
      --status-blocked-bg:    #FBEAEA;
      --status-not-started-bg:#F2F2F2;
      --status-gap-bg:        #F3ECEA;

      /* ── CEAL Green spacing scale ───────────────────────────── */
      --sp-1:  8px;
      --sp-2:  16px;
      --sp-3:  24px;
      --sp-4:  32px;
      --sp-5:  48px;
      --sp-6:  64px;
      --sp-7:  96px;

      /* ── Border radius scale ────────────────────────────────── */
      --radius-sm:  4px;
      --radius-md:  8px;   /* Default per CEAL Green brand */
      --radius-lg:  12px;
      --radius-xl:  24px;  /* Updated to GL-003 §0 structural container minimum */
    }

    /* ═══════════════════════════════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--cg-oatmeal);
      color: var(--cg-near-black);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TYPOGRAPHY HELPERS
       Source: ceal-green-brand-guidelines.md §5 — Approved type scale
    ═══════════════════════════════════════════════════════════════════════ */
    .sg-h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--cg-mangrove);
    }
    .sg-h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .sg-h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .sg-h4 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
    }
    .inter-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PAGE SHELL
    ═══════════════════════════════════════════════════════════════════════ */
    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: var(--sp-5) var(--sp-4);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TOP NAV BAR
    ═══════════════════════════════════════════════════════════════════════ */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--cg-mangrove);
      border-bottom: 2px solid var(--cg-mangrove-dark);
    }

    .top-nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      height: 52px;
    }

    .nav-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--cg-mid-canopy);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-right: var(--sp-2);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: var(--sp-1);
      flex-wrap: wrap;
    }

    .nav-link {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      padding: 5px 12px;
      border-radius: var(--radius-md);
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-link:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════════════════════ */
    .header {
      margin-bottom: var(--sp-4);
      padding-top: var(--sp-4);
    }

    .version-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--cg-mangrove);
      color: var(--cg-mid-canopy);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: var(--radius-md);
      margin-bottom: var(--sp-2);
    }

    .header-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--cg-mangrove);
      margin-bottom: var(--sp-1);
    }

    .header-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-top: var(--sp-2);
      margin-bottom: var(--sp-3);
      align-items: flex-start;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--cg-surface);
      border: 1px solid var(--cg-pale-sand);
      border-radius: var(--radius-md);
      padding: 6px 12px;
    }

    .meta-chip-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cg-aged-teak);
    }

    .meta-chip-value {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--cg-near-black);
    }

    .goal-statement {
      background: var(--cg-mangrove);
      border-radius: var(--radius-lg);
      padding: var(--sp-3) var(--sp-4);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      max-width: 860px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       STATUS BANNER
    ═══════════════════════════════════════════════════════════════════════ */
    .status-banner {
      background: #FEF3E2;
      border: 2px solid var(--status-progress);
      border-radius: var(--radius-lg);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-4);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--sp-2) var(--sp-4);
      align-items: start;
    }

    .banner-left {}

    .banner-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--status-progress);
      margin-bottom: 4px;
    }

    .banner-current {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--cg-near-black);
      margin-bottom: var(--sp-1);
    }

    .banner-blocker {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--status-blocked-bg);
      border-left: 3px solid var(--status-blocked);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: var(--sp-1) var(--sp-2);
      margin-top: var(--sp-1);
      margin-bottom: var(--sp-1);
    }

    .banner-blocker-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--status-blocked);
      white-space: nowrap;
      padding-top: 1px;
    }

    .banner-blocker-text {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--cg-near-black);
      line-height: 1.5;
    }

    .banner-next-action {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--cg-near-black);
      line-height: 1.5;
    }

    .banner-next-action strong {
      color: var(--status-progress);
    }

    .banner-right {
      text-align: right;
    }

    .banner-updated {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: rgba(0,0,0,0.45);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       STATUS LEGEND
    ═══════════════════════════════════════════════════════════════════════ */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-1);
      margin-bottom: var(--sp-4);
      align-items: center;
    }

    .legend-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--cg-near-black);
      opacity: 0.5;
      margin-right: 4px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--cg-near-black);
      background: var(--cg-surface);
      border: 1px solid var(--cg-pale-sand);
      border-radius: var(--radius-md);
      padding: 3px 9px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;  /* FIX squint test: 7px dots disappeared on blur; 10px minimum for reliable shape recognition */
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       STATUS BADGE COMPONENT
    ═══════════════════════════════════════════════════════════════════════ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }

    .badge--approved   { background: var(--status-approved-bg);    color: var(--status-approved);   }
    .badge--progress   { background: var(--status-progress-bg);    color: var(--status-progress);   }
    .badge--blocked    { background: var(--status-blocked-bg);     color: var(--status-blocked);    }
    .badge--not-started{ background: var(--status-not-started-bg); color: var(--status-not-started);}
    .badge--gap        { background: var(--status-gap-bg);         color: var(--status-gap);        }
    .badge--needs-config{ background: #EEF2FA;                     color: #2E4A8A;                  }

    /* ═══════════════════════════════════════════════════════════════════════
       SECTION HEADERS (shared across phases)
    ═══════════════════════════════════════════════════════════════════════ */
    .section-header {
      margin-bottom: var(--sp-5);
    }

    .section-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cg-aged-teak);
      margin-bottom: 4px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PREREQUISITE TRACK
    ═══════════════════════════════════════════════════════════════════════ */
    .prereq-section {
      margin-bottom: var(--sp-5);
    }

    .prereq-section-header {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
      margin-bottom: var(--sp-3);
    }

    .prereq-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--cg-near-black);
    }

    .prereq-section-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: rgba(0,0,0,0.5);
    }

    .prereq-track {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-2);   /* FIX §1A-1 Proximity: gap=0 collapsed all steps into one block */
      position: relative;
    }

    /* Connector line between prereq steps */
    .prereq-track::before {
      content: '';
      position: absolute;
      top: 28px;
      left: 12.5%;
      right: 12.5%;
      height: 2px;
      background: var(--cg-pale-sand);
      z-index: 0;
    }

    .prereq-step {
      position: relative;
      padding: 0;   /* remove horizontal padding now that grid gap provides separation */
      cursor: pointer;
    }

    .prereq-step-inner {
      background: var(--cg-surface);
      border: 1.5px solid var(--cg-pale-sand);
      border-radius: var(--radius-lg);
      padding: var(--sp-3);
      height: 100%;
      transition: box-shadow 0.15s, border-color 0.15s;
      position: relative;
      z-index: 1;
    }

    .prereq-step-inner:hover {
      box-shadow: 0 4px 20px rgba(30,77,58,0.12);
      border-color: var(--cg-mangrove);
    }

    .prereq-step-num {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);  /* FIX §1A-4 decisive-difference: 0.35 was near-invisible; step numbers are the primary sequence signal */
      margin-bottom: 4px;
    }

    .prereq-step-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--cg-near-black);
      margin-bottom: var(--sp-1);
      line-height: 1.3;
    }

    .prereq-step-version {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: rgba(0,0,0,0.55);  /* FIX §1A-4 decisive-difference: 0.45 was below readable threshold */
      margin-top: 4px;
    }

    .prereq-step--gated .prereq-step-inner {
      border-color: var(--status-not-started);
      background: var(--status-not-started-bg);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PHASE BAND
    ═══════════════════════════════════════════════════════════════════════ */
    .phase-band {
      margin-bottom: var(--sp-5);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1.5px solid var(--cg-pale-sand);
    }

    .phase-header {
      padding: var(--sp-3) var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      justify-content: space-between;
    }

    /* FIX §12a/§12e Full-fill anti-pattern: unique hue per phase encoded position in sequence
       via fill color — a named violation. Phase identity is carried by Phase number + title.
       All three headers now use the same structural dark ground (mangrove-dark).
       Phase 2 and Phase 3 get a left accent bar in their own tone so they remain
       visually distinct without encoding position through a full flood of a unique hue. */
    .phase-header--1 { background: var(--cg-mangrove-dark); }
    .phase-header--2 { background: var(--cg-mangrove-dark); border-left: 5px solid #2A7A9A; }
    .phase-header--3 { background: var(--cg-mangrove-dark); border-left: 5px solid var(--cg-aged-teak); }

    .phase-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 2px;
    }

    .phase-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .phase-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-top: 2px;
    }

    .phase-count-pill {
      background: rgba(255,255,255,0.15);
      border-radius: var(--radius-md);
      padding: 4px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
    }

    .phase-body {
      background: var(--cg-surface-warm);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PHASE SUB-SECTIONS (Customer Experience, Internal Systems)
    ═══════════════════════════════════════════════════════════════════════ */
    .phase-subsections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
    }

    .phase-subsection {
      background: var(--cg-surface);
      border: 1px solid var(--cg-pale-sand);
      border-radius: var(--radius-lg);
      padding: var(--sp-3);
    }

    .subsection-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--cg-mangrove);
      letter-spacing: 0.02em;
      margin-bottom: var(--sp-1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subsection-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--cg-mangrove);
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .subsection-body {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: var(--cg-near-black);
      opacity: 0.8;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       MILESTONE GRID
    ═══════════════════════════════════════════════════════════════════════ */
    .milestones-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--cg-near-black);
      margin-bottom: var(--sp-2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .milestone-group-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.6);  /* FIX squint test: 0.4 disappeared on blur; group labels are primary structural dividers within a phase */
      margin-bottom: var(--sp-1);
      margin-top: var(--sp-2);
    }

    .milestone-group-label:first-child {
      margin-top: 0;
    }

    .milestones-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2);
    }

    .milestone-card {
      background: var(--cg-surface);
      border: 1.5px solid var(--cg-pale-sand);
      border-radius: var(--radius-lg);
      padding: var(--sp-2) var(--sp-3);
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .milestone-card:hover {
      box-shadow: 0 4px 18px rgba(30,77,58,0.14);
      border-color: var(--cg-mangrove);
      transform: translateY(-1px);
    }

    /* Left accent bar — color-coded by status */
    .milestone-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 2px;
    }

    .milestone-card[data-status="approved"]::before     { background: var(--status-approved); }
    .milestone-card[data-status="in-progress"]::before  { background: var(--status-progress); }
    .milestone-card[data-status="blocked"]::before      { background: var(--status-blocked);  }
    .milestone-card[data-status="not-started"]::before  { background: var(--status-not-started); }
    .milestone-card[data-status="needs-hiring"]::before { background: var(--status-gap); }
    .milestone-card[data-status="needs-configuration"]::before { background: #2E4A8A; }

    .milestone-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--cg-near-black);
      line-height: 1.3;
      padding-left: 8px; /* clear the accent bar */
    }

    const [cls, label] = map[status] || ["badge--not-started", status];
    let html = `<span class="badge ${cls}">${label}</span>`;
    if (notFinal) {
      html += ` <span class="not-final-warning">Not Final</span>`;
    }
    return html;

    <div class="footer-right">
      <div>Last updated: ${esc(projectData.meta.lastUpdated)}</div>
      <div class="footer-update-note">This document is maintained as a live project record. Updated at session close or on request.</div>
    </div>
  `;

  /* ────────────────────────────────────────────────────────────────────────
     MODAL SYSTEM
     Builds a flat lookup map of all milestones for O(1) access.
  ──────────────────────────────────────────────────────────────────────── */
  const milestoneIndex = {};

  /* Index prerequisites */
  projectData.prerequisites.forEach(function(p) {
    milestoneIndex[p.id] = {
      title:        p.title,
      status:       p.status,
      notFinal:     p.notFinal,
      date:         p.date,
      owner:        null,
      gatedOn:      p.gatedOn || null,
      unlocks:      null,
      detail:       p.detail,
      url:          p.url || null,
      relatedItems: p.relatedItems || []
    };
  });

  /* Index phase milestones */
  projectData.phases.forEach(function(phase) {
    phase.milestones.forEach(function(ms) {
      milestoneIndex[ms.id] = ms;
    });
  });

  /* Index agentic milestones */
  projectData.agenticPlatform.milestones.forEach(function(ms) {
    milestoneIndex[ms.id] = ms;
  });

  /* Back-navigation state — tracks which modal was open before navigating to another */
  let prevModalId = null;

  window.openModal = function(id, section, fromId) {
    prevModalId = fromId || null;

    const ms = milestoneIndex[id];
    if (!ms) return;

    /* Store current ID on the modal element for chip click handlers */
    document.getElementById('modal').dataset.currentId = id;

    document.getElementById('modal-badge-slot').innerHTML = badgeHTML(ms.status, ms.notFinal);
    document.getElementById('modal-title').textContent = ms.title;

    let bodyHTML = '';

    /* ── Back link ───────────────────────────────────────────────────── */
    if (prevModalId && milestoneIndex[prevModalId]) {
      const prevTitle = milestoneIndex[prevModalId].title;
      bodyHTML += `
        <div style="margin-bottom:12px">
          <a href="#"
             onclick="event.preventDefault(); openModal('${prevModalId}', null);"
             style="font-family:Inter,sans-serif;font-size:12px;color:var(--cg-aged-teak);text-decoration:none;display:inline-flex;align-items:center;gap:4px;"
             onmouseover="this.style.textDecoration='underline'"
             onmouseout="this.style.textDecoration='none'">&#8592; ${esc(prevTitle)}</a>
        </div>
      `;
    }

    /* Date row */
    if (ms.date) {
      bodyHTML += `
        <div class="modal-section">
          <div class="modal-section-label">Date</div>
          <div class="modal-section-value">${esc(ms.date)}</div>
        </div>
        <hr class="modal-divider">
      `;
    }

    /* Owner row */
    if (ms.owner) {
      bodyHTML += `
        <div class="modal-section">
          <div class="modal-section-label">Owner</div>
          <div class="modal-section-value">${esc(ms.owner)}</div>
        </div>
        <hr class="modal-divider">
      `;
    }

    /* Detail */
    if (ms.detail) {
      bodyHTML += `
        <div class="modal-section">
          <div class="modal-section-label">Detail</div>
          <div class="modal-detail-text">${esc(ms.detail)}</div>
        </div>
      `;
    }

    /* Document link */
    if (ms.url) {
      const vaultBase = 'file:///Users/peteranthony/Peter%20OS%202/';
      const displayPath = ms.url.startsWith(vaultBase)
        ? decodeURIComponent(ms.url.slice(vaultBase.length))
        : decodeURIComponent(ms.url.split('/').pop());
      bodyHTML += `
        <hr class="modal-divider">
        <div class="modal-section">
          <div class="modal-section-label">Document</div>
          <div class="modal-section-value">
            <a href="${ms.url}"
               style="font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--cg-aged-teak);text-decoration:none;display:inline-flex;align-items:center;gap:5px;word-break:break-all;"
               onmouseover="this.style.textDecoration='underline'"
               onmouseout="this.style.textDecoration='none'">
              ${esc(displayPath)} <span style="font-size:11px;opacity:0.7">&#8599;</span>
            </a>
          </div>
        </div>
      `;
    }

    /* Gated on */
    if (ms.gatedOn) {
      bodyHTML += `
        <hr class="modal-divider">
        <div class="modal-section">
          <div class="modal-section-label">Gated On</div>
          <div class="modal-gated-box">
            <div class="modal-section-value">${esc(ms.gatedOn)}</div>
          </div>
        </div>
      `;
    }

    /* Unlocks */
    if (ms.unlocks) {
      bodyHTML += `
        <div class="modal-section">
          <div class="modal-section-label">Unlocks</div>
          <div class="modal-unlocks-box">
            <div class="modal-section-value">${esc(ms.unlocks)}</div>
          </div>
        </div>
      `;
    }

    /* ── Connected items ─────────────────────────────────────────────── */
    const related = ms.relatedItems || [];
    if (related.length > 0) {
      const chipsHTML = related.map(function(item) {
        return `<button
          onclick="openModal('${item.id}', null, '${id}')"
          style="
            display:inline-flex;align-items:center;gap:5px;
            font-family:Inter,sans-serif;font-size:12px;font-weight:500;
            color:var(--cg-aged-teak);
            background:transparent;
            border:1px solid var(--cg-aged-teak);
            border-radius:var(--radius-sm);
            padding:4px 10px;
            cursor:pointer;
            transition:background 0.15s ease;
          "
          onmouseover="this.style.background='rgba(184,122,78,0.10)'"
          onmouseout="this.style.background='transparent'"
        >${esc(item.label)} <span style="opacity:0.7">&#8599;</span></button>`;
      }).join('');

      bodyHTML += `
        <hr class="modal-divider" style="margin-top:16px">
        <div style="margin-top:12px">
          <div style="font-family:Inter,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(26,31,30,0.4);margin-bottom:8px">Connected Items</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${chipsHTML}</div>
        </div>
      `;
    }

    /* NOT FINAL warning strip — prepended after all other body content is assembled */
    if (ms.notFinal) {
      const backLink = bodyHTML.startsWith('<div style="margin-bottom:12px">') ? bodyHTML.slice(0, bodyHTML.indexOf('</div>') + 6) : '';
      const rest     = backLink ? bodyHTML.slice(backLink.length) : bodyHTML;
      bodyHTML = backLink + `
        <div class="modal-blocked-box" style="margin-bottom:0">
          <div style="font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:var(--status-blocked)">NOT FINAL — Awaiting Approval</div>
          <div style="font-family:Inter,sans-serif;font-size:12px;color:var(--cg-near-black);margin-top:3px;line-height:1.5">This document has been shared but is not yet approved. Do not treat it as the basis for production or hiring decisions until Ryan Roper confirms approval.</div>
        </div>
        <hr class="modal-divider">
      ` + rest;
    }

    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-backdrop').classList.add('open');
    document.getElementById('modal').focus();
  };

  /* Close modal */
  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ────────────────────────────────────────────────────────────────────────
     BUSINESS MODEL TAB SWITCHER
  ──────────────────────────────────────────────────────────────────────── */
  window.switchBMTab = function(tabEl, panelId) {
    /* Deactivate all tabs */
    document.querySelectorAll('.bm-tab').forEach(function(t) { t.classList.remove('active'); });
    /* Deactivate all panels */
    document.querySelectorAll('.bm-panel').forEach(function(p) { p.classList.remove('active'); });
    /* Activate selected */
    tabEl.classList.add('active');
    document.getElementById(panelId).classList.add('active');
  };

})();
</script>

</body>
</html>
